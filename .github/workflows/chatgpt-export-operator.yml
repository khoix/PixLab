name: Finalize Operator Preview utilities

on:
  push:
    branches:
      - chatgpt/operator-utility-rendering

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/operator-utility-rendering

      - name: Patch rarity-aware composition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/lib/game/compendium.ts')
          text = path.read_text()
          replacements = [
              (
                  "import { COLORS } from './constants';",
                  "import { COLORS } from './constants';\nimport { drawItemWithRarity } from './rarity-rendering';",
              ),
              (
                  "  loadout: { weapon: Item | null; armor: Item | null; utility: Item | null }\n): Promise<void> {",
                  "  loadout: { weapon: Item | null; armor: Item | null; utility: Item | null },\n  timeMs: number = Date.now()\n): Promise<void> {",
              ),
              (
                  "    ctx.drawImage(armorImg, 0, 0, COMPENDIUM_SIZE, COMPENDIUM_SIZE);",
                  "    drawItemWithRarity(ctx, armorImg, loadout.armor, COMPENDIUM_SIZE, COMPENDIUM_SIZE, timeMs);",
              ),
              (
                  "    ctx.drawImage(weaponImg, 0, 0, COMPENDIUM_SIZE, COMPENDIUM_SIZE);",
                  "    drawItemWithRarity(ctx, weaponImg, loadout.weapon, COMPENDIUM_SIZE, COMPENDIUM_SIZE, timeMs);",
              ),
              (
                  "    ctx.drawImage(gauntletsImg, 0, 0, COMPENDIUM_SIZE, COMPENDIUM_SIZE);",
                  "    drawItemWithRarity(ctx, gauntletsImg, loadout.armor, COMPENDIUM_SIZE, COMPENDIUM_SIZE, timeMs);",
              ),
              (
                  "    ctx.drawImage(utilityImg, 0, 0, COMPENDIUM_SIZE, COMPENDIUM_SIZE);",
                  "    drawItemWithRarity(ctx, utilityImg, loadout.utility, COMPENDIUM_SIZE, COMPENDIUM_SIZE, timeMs);",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate utility PNGs
        run: |
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          const names = ['scope', 'thruster', 'scanner', 'amplifier'];
          for (const name of names) {
            const path = `client/public/imgs/compendium/ops/utility/${name}.png`;
            const meta = await sharp(path).metadata();
            if (meta.width !== 256 || meta.height !== 256 || meta.format !== 'png' || !meta.hasAlpha) {
              throw new Error(`${name}: expected 256x256 RGBA PNG, got ${JSON.stringify(meta)}`);
            }
            console.log(`${name}: ${meta.width}x${meta.height} ${meta.space} alpha=${meta.hasAlpha}`);
          }
          JS

      - name: TypeScript check
        run: npm run check

      - name: Remove temporary workflow and commit final integration
        run: |
          rm .github/workflows/chatgpt-export-operator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/lib/game/compendium.ts .github/workflows/chatgpt-export-operator.yml
          git commit -m "feat: integrate rarity-aware operator composition"
          git push origin HEAD:chatgpt/operator-utility-rendering
